<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Game Hub 游戏库封面（16:9）：钢厂夜空、标题，右边是那只写着 NOT MINE 的鞋盒盒盖和柯蒂斯的狗牌 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#231915"/><stop offset="1" stop-color="#0E0B0A"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy="1" r=".8"><stop offset="0" stop-color="#A0461A" stop-opacity=".6"/><stop offset="1" stop-color="#A0461A" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9A574"/><stop offset="1" stop-color="#A9824F"/></linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DAD8D2"/><stop offset="1" stop-color="#9C9A94"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <text x="1310" y="700" text-anchor="end" font-size="400" font-weight="700" fill="#E9E1CF" fill-opacity=".035" font-family="'American Typewriter', 'Courier New', Courier, monospace">1950</text>
  <!-- 钢厂飘上来的火星 -->
  <g fill="#FF8A3D">
    <circle cx="140" cy="600" r="1.8" opacity=".55"/><circle cx="310" cy="470" r="1.3" opacity=".4"/><circle cx="520" cy="640" r="2.1" opacity=".5"/>
    <circle cx="690" cy="330" r="1.4" opacity=".35"/><circle cx="880" cy="600" r="1.9" opacity=".5"/><circle cx="1040" cy="660" r="1.5" opacity=".45"/>
    <circle cx="1210" cy="420" r="2.2" opacity=".4"/><circle cx="60" cy="300" r="1.5" opacity=".3"/><circle cx="420" cy="190" r="1.6" opacity=".3"/>
    <circle cx="760" cy="120" r="1.2" opacity=".25"/><circle cx="600" cy="520" r="1.4" opacity=".4"/><circle cx="1150" cy="140" r="1.7" opacity=".3"/>
  </g>

  <g font-family="'Songti SC', 'STSong', 'Noto Serif SC', 'Noto Serif CJK SC', 'Source Han Serif SC', SimSun, serif">
    <text x="96" y="222" font-size="18" letter-spacing="6" fill="#6F695C" font-family="'American Typewriter', 'Courier New', Courier, monospace">MONVALE, PENNSYLVANIA · 1950—2026</text>
    <text x="92" y="330" font-size="88" font-weight="900" fill="#E9E1CF">生于一九五〇</text>
    <rect x="96" y="378" width="70" height="4" fill="#D06A2C"/>
    <text x="186" y="391" font-size="30" font-weight="700" fill="#A9A08D" letter-spacing="10">鞋盒里的美国</text>
    <text x="96" y="476" font-size="25" fill="#A9A08D">一个钢铁镇男孩的七十六年，</text>
    <text x="96" y="516" font-size="25" fill="#A9A08D">和一只写着“不是我的”的鞋盒。</text>
  </g>

  <g transform="translate(1000 300) rotate(-7) scale(1.12)" filter="url(#sh)">
    <rect x="-165" y="-110" width="330" height="220" rx="6" fill="url(#card)"/>
    <rect x="-155" y="-100" width="310" height="200" rx="4" fill="none" stroke="#7A5A33" stroke-opacity=".55" stroke-width="2"/>
    <text x="-139" y="-75" font-size="15" font-weight="700" fill="#7E2A1C" fill-opacity=".7" font-family="'Bradley Hand', 'Segoe Script', cursive">Thom McAn</text>
    <text x="-139" y="-60" font-size="8" letter-spacing="1" fill="#4A3520" fill-opacity=".6" font-family="'American Typewriter', 'Courier New', monospace" xml:space="preserve">SIZE 10½  ·  BLACK OXFORD</text>
    <text x="0" y="34" text-anchor="middle" font-size="52" fill="#1E1B18" fill-opacity=".9" transform="rotate(-3)" font-family="'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive">NOT MINE</text>
    <rect x="75" y="-116" width="110" height="24" fill="#F3EBD2" fill-opacity=".35" transform="rotate(12 130 -104)"/>
  </g>
  <path d="M1048 492Q960 520 882 430" fill="none" stroke="#C9C6BE" stroke-width="6" stroke-linecap="round" stroke-dasharray=".5 9"/>
  <g transform="translate(1122 512) rotate(14) scale(.62)" filter="url(#sh)">
    <rect x="-150" y="-85" width="300" height="170" rx="34" fill="url(#tag)" stroke="#6E6C66" stroke-width="4"/>
    <circle cx="-123" cy="0" r="11" fill="none" stroke="#6E6C66" stroke-width="4"/>
    <g fill="#3A3834" font-weight="700" font-family="'Courier New', Courier, monospace">
      <text x="-98" y="-25" font-size="40">BELL</text>
      <text x="-98" y="18" font-size="34">CURTIS L</text>
      <text x="-98" y="55" font-size="28">O POS</text>
    </g>
  </g>
  <rect width="1280" height="720" fill="url(#vig)"/>
</svg>
